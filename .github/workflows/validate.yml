name: Validate Public Boundary

on:
  push:
  pull_request:
  # Merge queue (Repository_Management#1890): required checks must report on the queue's merge commit.
  merge_group:

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[corpus,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m mypy
      - run: python -m pytest
