name: Propose a Data Source
description: Register a launch-monitor dataset or comparison source
title: "Data Source: "
labels: ["data-source", "needs-rights-review"]
body:
  - type: input
    id: url
    attributes:
      label: Source URL or DOI
    validations:
      required: true
  - type: input
    id: monitor
    attributes:
      label: Manufacturer and exact model
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License or permission statement
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Provenance and collection conditions
      description: Include versions, environment, units, ball, and measured/estimated status.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent and privacy
      options:
        - label: I have the right to share this data and removed unlicensed personal information.
          required: true
