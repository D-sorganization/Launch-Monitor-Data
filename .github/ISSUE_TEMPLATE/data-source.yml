name: Propose a Data Source
description: Propose a source for private rights and privacy review; do not attach data
title: "Data Source: "
labels: ["data-source", "needs-rights-review"]
body:
  - type: input
    id: url
    attributes:
      label: Source URL or DOI
    validations:
      required: true
  - type: input
    id: monitor
    attributes:
      label: Manufacturer and exact model
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License or permission statement
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Provenance and collection conditions
      description: Include versions, environment, units, ball, and measured/estimated status.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Do not paste or attach real rows, player information, or source files to this public issue."
  - type: checkboxes
    id: consent
    attributes:
      label: Consent and privacy
      options:
        - label: I have not attached data and can provide rights/consent evidence privately.
          required: true
