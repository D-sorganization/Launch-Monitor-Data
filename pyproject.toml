[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "launch-monitor-data"
version = "0.1.0"
description = "Authenticated client for private launch-monitor data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "D-sorganization" }]
dependencies = []

[project.optional-dependencies]
corpus = ["pandas>=2.0", "pyarrow>=14.0"]
dev = [
  "mypy>=1.11",
  "pandas-stubs>=2.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
launch-monitor-data = "launch_monitor_data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/launch_monitor_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "pandas.*"]
ignore_missing_imports = true
